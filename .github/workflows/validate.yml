name: Validate agents
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read skill source registry
        run: curl --fail --silent --show-error --retry 3 https://raw.githubusercontent.com/zbwork/skills/main/catalog/v1/skills.json -o /tmp/skills.json
      - run: python3 scripts/build.py --skills-catalog /tmp/skills.json --check
